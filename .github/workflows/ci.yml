name: ci

on:
  push:
    branches: [develop, "feature/**"]
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "src/**"
      - "infra/**"
      - "requirements*.txt"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.out.outputs.env }}
      version: ${{ steps.out.outputs.version }}
      artifact_bucket: ${{ steps.out.outputs.artifact_bucket }}
    steps:
      - uses: actions/checkout@v4

      - id: out
        run: |
          bucket="${{ vars.ARTIFACT_BUCKET }}"
          if [[ -z "$bucket" ]]; then
            bucket="${{ secrets.ARTIFACT_BUCKET }}"
          fi

          ref="${GITHUB_REF}"
          if [[ "$ref" == refs/tags/* ]]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "version=${ref#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
            branch="${ref#refs/heads/}"
            safe_branch="$(echo "$branch" | tr '/_.' '-' )"
            echo "version=${safe_branch}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

          echo "artifact_bucket=$bucket" >> "$GITHUB_OUTPUT"

  build_test_publish:
    runs-on: ubuntu-latest
    needs: meta
    outputs:
      layer_key: ${{ steps.pub.outputs.layer_key }}
      layer_ver: ${{ steps.pub.outputs.layer_ver }}
      auth_key: ${{ steps.pub.outputs.auth_key }}
      auth_ver: ${{ steps.pub.outputs.auth_ver }}
      admin_key: ${{ steps.pub.outputs.admin_key }}
      admin_ver: ${{ steps.pub.outputs.admin_ver }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev deps + run tests
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements-dev.txt ]]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest
          fi
          pytest -q

      - name: Build layer (requirements.txt) + lambda zips
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          # ---- Layer zip (must contain "python/" folder at root) ----
          mkdir -p dist/layer/python
          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt -t dist/layer/python
          fi
          (cd dist/layer && zip -r ../python-deps-layer.zip .)

          # ---- Auth lambda zip ----
          test -f src/auth_lambda.py
          mkdir -p dist/auth
          cp src/auth_lambda.py dist/auth/auth_lambda.py
          (cd dist/auth && zip -r ../auth.zip .)

          # ---- Admin/create-user lambda zip ----
          test -f src/create_user_lambda.py
          mkdir -p dist/admin
          cp src/create_user_lambda.py dist/admin/create_user_lambda.py
          (cd dist/admin && zip -r ../admin_create_user.zip .)

      - name: Configure AWS creds (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.meta.outputs.env == 'prod' && secrets.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - id: pub
        name: Publish artifacts to S3 (versioned)
        run: |
          set -euo pipefail

          bucket="${{ needs.meta.outputs.artifact_bucket }}"
          ver="${{ needs.meta.outputs.version }}"
          env="${{ needs.meta.outputs.env }}"

          if [[ "$env" == "prod" ]]; then
            prefix="releases/${ver}"
          else
            prefix="dev/${ver}"
          fi

          upload () {
            local file="$1"
            local key="$2"

            aws s3 cp "$file" "s3://${bucket}/${key}"
            local vid
            vid="$(aws s3api head-object --bucket "${bucket}" --key "${key}" --query VersionId --output text)"
            echo "$vid"
          }

          layer_key="${prefix}/python-deps-layer.zip"
          layer_vid="$(upload dist/python-deps-layer.zip "$layer_key")"
          echo "layer_key=$layer_key" >> "$GITHUB_OUTPUT"
          echo "layer_ver=$layer_vid" >> "$GITHUB_OUTPUT"

          auth_key="${prefix}/auth.zip"
          auth_vid="$(upload dist/auth.zip "$auth_key")"
          echo "auth_key=$auth_key" >> "$GITHUB_OUTPUT"
          echo "auth_ver=$auth_vid" >> "$GITHUB_OUTPUT"

          admin_key="${prefix}/admin_create_user.zip"
          admin_vid="$(upload dist/admin_create_user.zip "$admin_key")"
          echo "admin_key=$admin_key" >> "$GITHUB_OUTPUT"
          echo "admin_ver=$admin_vid" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: [meta, build_test_publish]
    environment: ${{ needs.meta.outputs.env }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS creds (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.meta.outputs.env == 'prod' && secrets.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation
        run: |
          set -euo pipefail

          env="${{ needs.meta.outputs.env }}"
          stack="viktron-${env}"
          bucket="${{ needs.meta.outputs.artifact_bucket }}"

          aws cloudformation deploy \
            --stack-name "$stack" \
            --template-file infra/app.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Env="$env" \
              ArtifactBucket="$bucket" \
              LayerArtifactKey="${{ needs.build_test_publish.outputs.layer_key }}" \
              LayerArtifactVersion="${{ needs.build_test_publish.outputs.layer_ver }}" \
              AuthArtifactKey="${{ needs.build_test_publish.outputs.auth_key }}" \
              AuthArtifactVersion="${{ needs.build_test_publish.outputs.auth_ver }}" \
              AdminArtifactKey="${{ needs.build_test_publish.outputs.admin_key }}" \
              AdminArtifactVersion="${{ needs.build_test_publish.outputs.admin_ver }}"
