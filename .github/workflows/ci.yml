name: ci

on:
  push:
    branches: [develop, "feature/**"]
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "src/**"
      - "infra/**"
      - "requirements*.txt"
      - "requirements-dev*.txt"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.out.outputs.env }}
      version: ${{ steps.out.outputs.version }}
      artifact_bucket: ${{ steps.out.outputs.artifact_bucket }}
      root_domain: ${{ steps.out.outputs.root_domain }}
      dns_stack: ${{ steps.out.outputs.dns_stack }}
      cors_allowed_origins: ${{ steps.out.outputs.cors_allowed_origins }}

      # frontend
      frontend_bucket: ${{ steps.out.outputs.frontend_bucket }}
      frontend_domain: ${{ steps.out.outputs.frontend_domain }}
      cloudfront_cert_arn: ${{ steps.out.outputs.cloudfront_cert_arn }}
      frontend_stack: ${{ steps.out.outputs.frontend_stack }}

    steps:
      - uses: actions/checkout@v4

      - id: out
        shell: bash
        run: |
          set -euo pipefail

          # REQUIRED existing repo vars
          bucket="${{ vars.ARTIFACT_BUCKET }}"
          root_domain="${{ vars.ROOT_DOMAIN }}"
          if [[ -z "$bucket" ]]; then echo "Missing vars.ARTIFACT_BUCKET"; exit 1; fi
          if [[ -z "$root_domain" ]]; then echo "Missing vars.ROOT_DOMAIN"; exit 1; fi

          dns_stack="${{ vars.DNS_STACK_NAME }}"
          if [[ -z "$dns_stack" ]]; then dns_stack="viktron-dns"; fi

          ref="${GITHUB_REF}"
          if [[ "$ref" == refs/tags/* ]]; then
            envname="prod"
            version="${ref#refs/tags/}"
            cors="${{ vars.CORS_ALLOWED_ORIGINS_PROD }}"
            frontend_bucket="${{ vars.FRONTEND_PROD_BUCKET }}"
            frontend_domain="${{ vars.FRONTEND_PROD_DOMAIN }}"
            frontend_stack="${{ vars.FRONTEND_STACK_NAME_PROD }}"
            if [[ -z "$frontend_stack" ]]; then frontend_stack="viktron-frontend-prod"; fi
          else
            envname="dev"
            branch="${ref#refs/heads/}"
            safe_branch="$(echo "$branch" | tr '/_.' '-' )"
            version="${safe_branch}-${GITHUB_SHA::7}"
            cors="${{ vars.CORS_ALLOWED_ORIGINS_DEV }}"
            frontend_bucket="${{ vars.FRONTEND_DEV_BUCKET }}"
            frontend_domain="${{ vars.FRONTEND_DEV_DOMAIN }}"
            frontend_stack="${{ vars.FRONTEND_STACK_NAME_DEV }}"
            if [[ -z "$frontend_stack" ]]; then frontend_stack="viktron-frontend-dev"; fi
          fi

          if [[ -z "$cors" ]]; then cors="http://localhost:4200"; fi

          # REQUIRED new repo var (CloudFront cert in us-east-1)
          cloudfront_cert_arn="${{ vars.CLOUDFRONT_CERT_ARN }}"
          if [[ -z "$cloudfront_cert_arn" ]]; then
            echo "Missing vars.CLOUDFRONT_CERT_ARN (ACM cert ARN in us-east-1 for CloudFront)"
            exit 1
          fi

          # REQUIRED new repo vars (bucket + domain)
          if [[ -z "$frontend_bucket" ]]; then
            echo "Missing FRONTEND_*_BUCKET (vars.FRONTEND_DEV_BUCKET / vars.FRONTEND_PROD_BUCKET)"
            exit 1
          fi
          if [[ -z "$frontend_domain" ]]; then
            echo "Missing FRONTEND_*_DOMAIN (vars.FRONTEND_DEV_DOMAIN / vars.FRONTEND_PROD_DOMAIN)"
            exit 1
          fi

          echo "env=$envname" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "root_domain=$root_domain" >> "$GITHUB_OUTPUT"
          echo "dns_stack=$dns_stack" >> "$GITHUB_OUTPUT"
          echo "cors_allowed_origins=$cors" >> "$GITHUB_OUTPUT"

          echo "frontend_bucket=$frontend_bucket" >> "$GITHUB_OUTPUT"
          echo "frontend_domain=$frontend_domain" >> "$GITHUB_OUTPUT"
          echo "cloudfront_cert_arn=$cloudfront_cert_arn" >> "$GITHUB_OUTPUT"
          echo "frontend_stack=$frontend_stack" >> "$GITHUB_OUTPUT"

  build_test_publish:
    runs-on: ubuntu-latest
    needs: meta
    outputs:
      layer_key: ${{ steps.pub.outputs.layer_key }}
      layer_ver: ${{ steps.pub.outputs.layer_ver }}
      auth_key: ${{ steps.pub.outputs.auth_key }}
      auth_ver: ${{ steps.pub.outputs.auth_ver }}
      admin_key: ${{ steps.pub.outputs.admin_key }}
      admin_ver: ${{ steps.pub.outputs.admin_ver }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev deps + run tests
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ -f requirements-dev.txt ]]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest
          fi
          pytest -q

      - name: Build layer (requirements.txt) + lambda zips
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          # Layer (python deps)
          mkdir -p dist/layer/python
          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt -t dist/layer/python
          fi
          (cd dist/layer && zip -r ../python-deps-layer.zip .)

          # Auth lambda zip
          test -f src/auth_lambda.py
          mkdir -p dist/auth
          cp src/auth_lambda.py dist/auth/auth_lambda.py
          (cd dist/auth && zip -r ../auth.zip .)

          # Admin lambdas zip (create + list + get + update)
          test -f src/create_user_lambda.py
          test -f src/list_users_lambda.py
          test -f src/get_user_lambda.py
          test -f src/update_user_lambda.py
          mkdir -p dist/admin
          cp src/create_user_lambda.py dist/admin/create_user_lambda.py
          cp src/list_users_lambda.py dist/admin/list_users_lambda.py
          cp src/get_user_lambda.py dist/admin/get_user_lambda.py
          cp src/update_user_lambda.py dist/admin/update_user_lambda.py
          (cd dist/admin && zip -r ../admin_create_user.zip .)

      - name: Configure AWS creds (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.meta.outputs.env == 'prod' && vars.AWS_ROLE_ARN_PROD || vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - id: pub
        name: Publish artifacts to S3 (versioned)
        run: |
          set -euo pipefail

          bucket="${{ needs.meta.outputs.artifact_bucket }}"
          ver="${{ needs.meta.outputs.version }}"
          envname="${{ needs.meta.outputs.env }}"

          if [[ "$envname" == "prod" ]]; then
            prefix="releases/${ver}"
          else
            prefix="dev/${ver}"
          fi

          upload () {
            local file="$1"
            local key="$2"
            aws s3 cp "$file" "s3://${bucket}/${key}" --only-show-errors 1>/dev/null
            aws s3api head-object \
              --bucket "${bucket}" \
              --key "${key}" \
              --query VersionId \
              --output text | tr -d '\r\n'
          }

          layer_key="${prefix}/python-deps-layer.zip"
          layer_vid="$(upload dist/python-deps-layer.zip "$layer_key")"
          echo "layer_key=$layer_key" >> "$GITHUB_OUTPUT"
          echo "layer_ver=$layer_vid" >> "$GITHUB_OUTPUT"

          auth_key="${prefix}/auth.zip"
          auth_vid="$(upload dist/auth.zip "$auth_key")"
          echo "auth_key=$auth_key" >> "$GITHUB_OUTPUT"
          echo "auth_ver=$auth_vid" >> "$GITHUB_OUTPUT"

          admin_key="${prefix}/admin_create_user.zip"
          admin_vid="$(upload dist/admin_create_user.zip "$admin_key")"
          echo "admin_key=$admin_key" >> "$GITHUB_OUTPUT"
          echo "admin_ver=$admin_vid" >> "$GITHUB_OUTPUT"

  deploy_dns:
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS creds (OIDC) - DNS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.meta.outputs.env == 'prod' && vars.AWS_ROLE_ARN_PROD || vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure DNS stack exists (create once)
        run: |
          set -euo pipefail

          dns_stack="${{ needs.meta.outputs.dns_stack }}"
          root_domain="${{ needs.meta.outputs.root_domain }}"

          if aws cloudformation describe-stacks --stack-name "$dns_stack" >/dev/null 2>&1; then
            echo "$dns_stack already exists, skipping."
            exit 0
          fi

          aws cloudformation deploy \
            --stack-name "$dns_stack" \
            --template-file infra/dns.yml \
            --parameter-overrides \
              HostedZoneName="$root_domain"

  deploy:
    runs-on: ubuntu-latest
    needs: [meta, build_test_publish, deploy_dns]
    environment: ${{ needs.meta.outputs.env }} # IMPORTANT: this must match your GH env names: dev / prod
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS creds (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.meta.outputs.env == 'prod' && vars.AWS_ROLE_ARN_PROD || vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve DNS stack outputs
        id: dns
        run: |
          set -euo pipefail

          dns_stack="${{ needs.meta.outputs.dns_stack }}"

          zone_id="$(aws cloudformation describe-stacks \
            --stack-name "$dns_stack" \
            --query "Stacks[0].Outputs[?OutputKey=='HostedZoneId'].OutputValue" \
            --output text)"

          # NOTE: your dns.yml certificate is eu-west-1; good for ALB/APIGW, NOT for CloudFront
          cert_euw1="$(aws cloudformation describe-stacks \
            --stack-name "$dns_stack" \
            --query "Stacks[0].Outputs[?OutputKey=='CertificateArn'].OutputValue" \
            --output text)"

          if [[ -z "$zone_id" ]]; then
            echo "Could not resolve HostedZoneId from $dns_stack"
            exit 1
          fi

          echo "hosted_zone_id=$zone_id" >> "$GITHUB_OUTPUT"
          echo "certificate_arn_euw1=$cert_euw1" >> "$GITHUB_OUTPUT"

      - name: Deploy CloudFormation (backend app)
        run: |
          set -euo pipefail

          envname="${{ needs.meta.outputs.env }}"
          stack="viktron-${envname}"
          bucket="${{ needs.meta.outputs.artifact_bucket }}"
          root_domain="${{ needs.meta.outputs.root_domain }}"
          allowed_origins="${{ needs.meta.outputs.cors_allowed_origins }}"

          google_client_id="${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}"
          google_client_secret="${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}"
          extra_params=()
          if [[ -n "${google_client_id}" && -n "${google_client_secret}" ]]; then
            extra_params+=("GoogleClientId=${google_client_id}")
            extra_params+=("GoogleClientSecret=${google_client_secret}")
          else
            echo "Google OAuth secrets not set for env=${envname}. Skipping Google IdP."
          fi

          aws cloudformation deploy \
            --stack-name "$stack" \
            --template-file infra/app.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Env="$envname" \
              ArtifactBucket="$bucket" \
              HostedZoneId="${{ steps.dns.outputs.hosted_zone_id }}" \
              HostedZoneName="$root_domain" \
              CertificateArn="${{ steps.dns.outputs.certificate_arn_euw1 }}" \
              AllowedOrigins="$allowed_origins" \
              LayerArtifactKey="${{ needs.build_test_publish.outputs.layer_key }}" \
              LayerArtifactVersion="${{ needs.build_test_publish.outputs.layer_ver }}" \
              AuthArtifactKey="${{ needs.build_test_publish.outputs.auth_key }}" \
              AuthArtifactVersion="${{ needs.build_test_publish.outputs.auth_ver }}" \
              AdminArtifactKey="${{ needs.build_test_publish.outputs.admin_key }}" \
              AdminArtifactVersion="${{ needs.build_test_publish.outputs.admin_ver }}" \
              "${extra_params[@]}"

      - name: Deploy CloudFormation (frontend CloudFront)
        run: |
          set -euo pipefail

          envname="${{ needs.meta.outputs.env }}"
          stack="${{ needs.meta.outputs.frontend_stack }}"
          root_domain="${{ needs.meta.outputs.root_domain }}"

          aws cloudformation deploy \
            --stack-name "$stack" \
            --template-file infra/frontend.yml \
            --parameter-overrides \
              Env="$envname" \
              HostedZoneId="${{ steps.dns.outputs.hosted_zone_id }}" \
              HostedZoneName="$root_domain" \
              SiteBucketName="${{ needs.meta.outputs.frontend_bucket }}" \
              SiteDomainName="${{ needs.meta.outputs.frontend_domain }}" \
              CertificateArnUsEast1="${{ needs.meta.outputs.cloudfront_cert_arn }}"
