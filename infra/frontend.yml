AWSTemplateFormatVersion: "2010-09-09"
Description: "Viktron Frontend - CloudFront + Route53 + S3 (existing bucket) using OAC"

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]
  HostedZoneId:
    Type: String
  HostedZoneName:
    Type: String
  SiteBucketName:
    Type: String
    Description: "Existing S3 bucket name that contains the built SPA (Angular dist)"
  SiteDomainName:
    Type: String
    Description: "FQDN, e.g. dev.anonvpn.net or anonvpn.net"
  CertificateArnUsEast1:
    Type: String
    Description: "ACM cert ARN in us-east-1 (required by CloudFront)"
  PriceClass:
    Type: String
    Default: PriceClass_100

Resources:
  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "viktron-frontend-oac-${Env}"
        Description: !Sub "OAC for Viktron frontend ${Env}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Viktron frontend ${Env}"
        PriceClass: !Ref PriceClass
        HttpVersion: http2
        IPV6Enabled: true
        Aliases:
          - !Ref SiteDomainName

        DefaultRootObject: index.html

        Origins:
          - Id: S3Origin
            DomainName: !Sub "${SiteBucketName}.s3.${AWS::Region}.amazonaws.com"
            OriginAccessControlId: !Ref FrontendOAC
            S3OriginConfig: {}

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none

        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArnUsEast1
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub "arn:aws:s3:::${SiteBucketName}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"
                AWS:SourceAccount: !Ref AWS::AccountId

  FrontendAliasRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  DistributionId:
    Value: !Ref FrontendDistribution
  DistributionDomainName:
    Value: !GetAtt FrontendDistribution.DomainName
  SiteUrl:
    Value: !Sub "https://${SiteDomainName}"
