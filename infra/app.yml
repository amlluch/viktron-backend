AWSTemplateFormatVersion: "2010-09-09"
Description: Viktron backend - Cognito + admin API (HTTP API) + Hosted UI (OAuth2) + optional Google IdP + custom domain + lambdas + python deps layer

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]

  ArtifactBucket:
    Type: String

  AuthArtifactKey:
    Type: String
  AuthArtifactVersion:
    Type: String

  AdminArtifactKey:
    Type: String
  AdminArtifactVersion:
    Type: String

  LayerArtifactKey:
    Type: String
  LayerArtifactVersion:
    Type: String

  HostedZoneId:
    Type: String
    Description: "Route53 hosted zone id for anonvpn.net (from viktron-dns stack)"

  HostedZoneName:
    Type: String
    Default: "anonvpn.net"

  CertificateArn:
    Type: String
    Description: "ACM certificate ARN for *.anonvpn.net (from viktron-dns stack)"

  # CORS (API Gateway HTTP API)
  # En DEV: local + dev web
  # En PROD: prod web
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:4200,https://dev.anonvpn.net,https://anonvpn.net"

  # -------------------------
  # Frontend URLs (per env)
  # -------------------------
  FrontendDevBaseUrl:
    Type: String
    Default: "https://dev.anonvpn.net"

  FrontendProdBaseUrl:
    Type: String
    Default: "https://anonvpn.net"

  # -------------------------
  # Cognito Hosted UI domain prefix (optional)
  # If empty, we fallback to: viktron-${Env}-${AWS::AccountId}
  # -------------------------
  CognitoDomainPrefix:
    Type: String
    Default: ""

  # -------------------------
  # Optional Google IdP (Hosted UI)
  # If both are non-empty, Google IdP is created and enabled in the client.
  # -------------------------
  GoogleClientId:
    Type: String
    Default: ""
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Default: ""

Conditions:
  IsProd: !Equals [!Ref Env, "prod"]
  HasCognitoDomainPrefix: !Not [!Equals [!Ref CognitoDomainPrefix, ""]]
  HasGoogle: !And
    - !Not [!Equals [!Ref GoogleClientId, ""]]
    - !Not [!Equals [!Ref GoogleClientSecret, ""]]

Resources:
  # -------------------------
  # Cognito
  # -------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "viktron-user-pool-${Env}"
      UsernameAttributes: [ email ]
      AutoVerifiedAttributes: [ email ]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: "admins"
      Description: "Viktron administrators"
      UserPoolId: !Ref UserPool

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !If
        - HasCognitoDomainPrefix
        - !Ref CognitoDomainPrefix
        - !Sub "viktron-${Env}-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

  GoogleIdentityProvider:
    Condition: HasGoogle
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      ProviderName: Google
      ProviderType: Google
      UserPoolId: !Ref UserPool
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        given_name: given_name
        family_name: family_name

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "viktron-app-client-${Env}"
      GenerateSecret: false

      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30

      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [ code ]
      AllowedOAuthScopes: [ openid, email, profile ]

      # DEV: local + dev web
      # PROD: prod web
      CallbackURLs: !If
        - IsProd
        - [ !Sub "${FrontendProdBaseUrl}/auth/callback" ]
        - [
            "http://localhost:4200/auth/callback",
            !Sub "${FrontendDevBaseUrl}/auth/callback"
          ]

      LogoutURLs: !If
        - IsProd
        - [ !Sub "${FrontendProdBaseUrl}/" ]
        - [
            "http://localhost:4200/",
            !Sub "${FrontendDevBaseUrl}/"
          ]

      SupportedIdentityProviders: !If
        - HasGoogle
        - [ COGNITO, Google ]
        - [ COGNITO ]

  # -------------------------
  # Layer: python dependencies
  # -------------------------
  PythonDepsLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub "viktron-python-deps-${Env}"
      CompatibleRuntimes: [ python3.12 ]
      Content:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref LayerArtifactKey
        S3ObjectVersion: !Ref LayerArtifactVersion

  # -------------------------
  # IAM roles
  # -------------------------
  AuthLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "viktron-auth-lambda-role-${Env}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoAuthCalls
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminInitiateAuth
                  - cognito-idp:AdminRespondToAuthChallenge
                Resource: !GetAtt UserPool.Arn

  AdminLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "viktron-admin-lambda-role-${Env}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoAdminCalls
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminGetUser
                Resource: !GetAtt UserPool.Arn

  # -------------------------
  # Lambdas
  # -------------------------
  AuthLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "viktron-auth-${Env}"
      Runtime: python3.12
      Handler: auth_lambda.lambda_handler
      Role: !GetAtt AuthLambdaRole.Arn
      Timeout: 10
      MemorySize: 256
      Layers: [ !Ref PythonDepsLayer ]
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref AuthArtifactKey
        S3ObjectVersion: !Ref AuthArtifactVersion
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          CLIENT_ID: !Ref UserPoolClient

  AdminCreateUserLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "viktron-admin-create-user-${Env}"
      Runtime: python3.12
      Handler: create_user_lambda.lambda_handler
      Role: !GetAtt AdminLambdaRole.Arn
      Timeout: 10
      MemorySize: 256
      Layers: [ !Ref PythonDepsLayer ]
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref AdminArtifactKey
        S3ObjectVersion: !Ref AdminArtifactVersion
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          ADMIN_GROUP: "admins"

  # -------------------------
  # HTTP API Gateway + JWT authorizer
  # -------------------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "viktron-api-${Env}"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [ GET, POST, OPTIONS ]
        AllowHeaders: [ authorization, content-type ]
        AllowCredentials: true
        MaxAge: 3600

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: !Sub "viktron-jwt-authorizer-${Env}"
      AuthorizerType: JWT
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClient
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  AdminCreateUserIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AdminCreateUserLambda.Arn
      PayloadFormatVersion: "2.0"

  AdminCreateUserRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /admin/users"
      Target: !Sub "integrations/${AdminCreateUserIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  AllowApiInvokeAdminCreateUser:
    Type: AWS::Lambda::Permission
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: !Ref AdminCreateUserLambda
      Principal: "apigateway.amazonaws.com"
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/POST/admin/users"

  # -------------------------
  # Custom domain + Route53 record (API)
  # -------------------------
  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !If
        - IsProd
        - !Sub "api.${HostedZoneName}"
        - !Sub "api-dev.${HostedZoneName}"
      DomainNameConfigurations:
        - EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
          CertificateArn: !Ref CertificateArn

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomainName
      Stage: !Ref HttpApiStage

  ApiDomainRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !If
        - IsProd
        - !Sub "api.${HostedZoneName}"
        - !Sub "api-dev.${HostedZoneName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiDomainName.RegionalDomainName
        HostedZoneId: !GetAtt ApiDomainName.RegionalHostedZoneId

Outputs:
  UserPoolId:
    Value: !Ref UserPool

  UserPoolClientId:
    Value: !Ref UserPoolClient

  CognitoHostedUiDomainPrefix:
    Value: !If
      - HasCognitoDomainPrefix
      - !Ref CognitoDomainPrefix
      - !Sub "viktron-${Env}-${AWS::AccountId}"

  CognitoHostedUiDomain:
    Value: !Sub
      - "${Prefix}.auth.${AWS::Region}.amazoncognito.com"
      - Prefix: !If
          - HasCognitoDomainPrefix
          - !Ref CognitoDomainPrefix
          - !Sub "viktron-${Env}-${AWS::AccountId}"

  CognitoHostedUiIssuer:
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  ApiEndpointExecuteApi:
    Value: !GetAtt HttpApi.ApiEndpoint

  ApiCustomDomain:
    Value: !If
      - IsProd
      - !Sub "https://api.${HostedZoneName}"
      - !Sub "https://api-dev.${HostedZoneName}"

  AdminUsersEndpoint:
    Value: !If
      - IsProd
      - !Sub "https://api.${HostedZoneName}/admin/users"
      - !Sub "https://api-dev.${HostedZoneName}/admin/users"
