AWSTemplateFormatVersion: "2010-09-09"
Description: Viktron backend - Cognito + admin API (HTTP API) + Hosted UI (OAuth2) + optional Google IdP + custom domain + lambdas + python deps layer

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]

  ArtifactBucket:
    Type: String

  AuthArtifactKey:
    Type: String
  AuthArtifactVersion:
    Type: String

  AdminArtifactKey:
    Type: String
  AdminArtifactVersion:
    Type: String

  LayerArtifactKey:
    Type: String
  LayerArtifactVersion:
    Type: String

  HostedZoneId:
    Type: String
    Description: "Route53 hosted zone id for anonvpn.net (from viktron-dns stack)"

  HostedZoneName:
    Type: String
    Default: "anonvpn.net"

  CertificateArn:
    Type: String
    Description: "ACM certificate ARN for *.anonvpn.net in eu-west-1 (API custom domain). From viktron-dns stack."

  # CORS (API Gateway HTTP API)
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:4200,https://dev.anonvpn.net,https://anonvpn.net"

  # -------------------------
  # Frontend URLs (used by Cognito callbacks)
  # -------------------------
  FrontendDevBaseUrl:
    Type: String
    Default: "https://dev.anonvpn.net"

  FrontendProdBaseUrl:
    Type: String
    Default: "https://anonvpn.net"

  # -------------------------
  # Cognito Hosted UI domain prefix (optional)
  # -------------------------
  CognitoDomainPrefix:
    Type: String
    Default: ""

  # -------------------------
  # Optional Google IdP (Hosted UI)
  # -------------------------
  GoogleClientId:
    Type: String
    Default: ""
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Default: ""

Conditions:
  IsProd: !Equals [!Ref Env, "prod"]
  HasCognitoDomainPrefix: !Not [!Equals [!Ref CognitoDomainPrefix, ""]]
  HasGoogle: !And
    - !Not [!Equals [!Ref GoogleClientId, ""]]
    - !Not [!Equals [!Ref GoogleClientSecret, ""]]

Resources:
  # -------------------------
  # Cognito
  # -------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "viktron-user-pool-${Env}"
      UsernameAttributes: [ email ]
      AutoVerifiedAttributes: [ email ]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: "admins"
      Description: "Viktron administrators"
      UserPoolId: !Ref UserPool

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !If
        - HasCognitoDomainPrefix
        - !Ref CognitoDomainPrefix
        - !Sub "viktron-${Env}-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

  GoogleIdentityProvider:
    Condition: HasGoogle
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      ProviderName: Google
      ProviderType: Google
      UserPoolId: !Ref UserPool
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        given_name: given_name
        family_name: family_name

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "viktron-app-client-${Env}"
      GenerateSecret: false

      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30

      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [ code ]
      AllowedOAuthScopes: [ openid, email, profile ]

      CallbackURLs: !If
        - IsProd
        - [ !Sub "${FrontendProdBaseUrl}/auth/callback" ]
        - [
            "http://localhost:4200/auth/callback",
            !Sub "${FrontendDevBaseUrl}/auth/callback"
          ]

      LogoutURLs: !If
        - IsProd
        - [ !Sub "${FrontendProdBaseUrl}/" ]
        - [
            "http://localhost:4200/",
            !Sub "${FrontendDevBaseUrl}/"
          ]

      SupportedIdentityProviders: !If
        - HasGoogle
        - [ COGNITO, Google ]
        - [ COGNITO ]

  # -------------------------
  # Layer: python dependencies
  # -------------------------
  PythonDepsLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub "viktron-python-deps-${Env}"
      CompatibleRuntimes: [ python3.12 ]
      Content:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref LayerArtifactKey
        S3ObjectVersion: !Ref LayerArtifactVersion

  # -------------------------
  # IAM roles
  # -------------------------
  AuthLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "viktron-auth-lambda-role-${Env}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoAuthCalls
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminInitiateAuth
                  - cognito-idp:AdminRespondToAuthChallenge
                Resource: !GetAtt UserPool.Arn

  AdminLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "viktron-admin-lambda-role-${Env}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoAdminCalls
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminGetUser
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminListGroupsForUser
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:AdminEnableUser
                  - cognito-idp:AdminDisableUser
                  - cognito-idp:AdminResetUserPassword
                  - cognito-idp:AdminSetUserPassword
                Resource: !GetAtt UserPool.Arn

  # -------------------------
  # Lambdas
  # -------------------------
  AuthLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "viktron-auth-${Env}"
      Runtime: python3.12
      Handler: auth_lambda.lambda_handler
      Role: !GetAtt AuthLambdaRole.Arn
      Timeout: 15
      MemorySize: 256
      Layers: [ !Ref PythonDepsLayer ]
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref AuthArtifactKey
        S3ObjectVersion: !Ref AuthArtifactVersion

  AdminCreateUserLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "viktron-admin-create-user-${Env}"
      Runtime: python3.12
      Handler: create_user_lambda.lambda_handler
      Role: !GetAtt AdminLambdaRole.Arn
      Timeout: 15
      MemorySize: 256
      Layers: [ !Ref PythonDepsLayer ]
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          ADMIN_GROUP: "admins"
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref AdminArtifactKey
        S3ObjectVersion: !Ref AdminArtifactVersion

  AdminListUsersLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "viktron-admin-list-users-${Env}"
      Runtime: python3.12
      Handler: list_users_lambda.lambda_handler
      Role: !GetAtt AdminLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Layers: [ !Ref PythonDepsLayer ]
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          ADMIN_GROUP: "admins"
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref AdminArtifactKey
        S3ObjectVersion: !Ref AdminArtifactVersion

  AdminGetUserLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "viktron-admin-get-user-${Env}"
      Runtime: python3.12
      Handler: get_user_lambda.lambda_handler
      Role: !GetAtt AdminLambdaRole.Arn
      Timeout: 15
      MemorySize: 256
      Layers: [ !Ref PythonDepsLayer ]
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          ADMIN_GROUP: "admins"
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref AdminArtifactKey
        S3ObjectVersion: !Ref AdminArtifactVersion

  AdminUpdateUserLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "viktron-admin-update-user-${Env}"
      Runtime: python3.12
      Handler: update_user_lambda.lambda_handler
      Role: !GetAtt AdminLambdaRole.Arn
      Timeout: 15
      MemorySize: 256
      Layers: [ !Ref PythonDepsLayer ]
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          ADMIN_GROUP: "admins"
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref AdminArtifactKey
        S3ObjectVersion: !Ref AdminArtifactVersion

  # -------------------------
  # HTTP API (API Gateway v2)
  # -------------------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "viktron-api-${Env}"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [ GET, POST, PATCH, OPTIONS ]
        AllowHeaders: [ authorization, content-type ]
        AllowCredentials: true
        MaxAge: 3600

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: !Sub "viktron-jwt-authorizer-${Env}"
      AuthorizerType: JWT
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClient
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  # ---- Public auth endpoint (no authorizer) ----
  AuthIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AuthLambda.Arn
      PayloadFormatVersion: "2.0"

  AuthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /auth"
      Target: !Sub "integrations/${AuthIntegration}"
      AuthorizationType: NONE

  AllowApiInvokeAuth:
    Type: AWS::Lambda::Permission
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: !Ref AuthLambda
      Principal: "apigateway.amazonaws.com"
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/POST/auth"

  # ---- Admin endpoints (JWT) ----
  AdminCreateUserIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AdminCreateUserLambda.Arn
      PayloadFormatVersion: "2.0"

  AdminCreateUserRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /admin/users"
      Target: !Sub "integrations/${AdminCreateUserIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  AllowApiInvokeAdminCreateUser:
    Type: AWS::Lambda::Permission
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: !Ref AdminCreateUserLambda
      Principal: "apigateway.amazonaws.com"
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/POST/admin/users"

  AdminListUsersIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AdminListUsersLambda.Arn
      PayloadFormatVersion: "2.0"

  AdminListUsersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /admin/users"
      Target: !Sub "integrations/${AdminListUsersIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  AllowApiInvokeAdminListUsers:
    Type: AWS::Lambda::Permission
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: !Ref AdminListUsersLambda
      Principal: "apigateway.amazonaws.com"
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/GET/admin/users"

  AdminGetUserIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AdminGetUserLambda.Arn
      PayloadFormatVersion: "2.0"

  AdminGetUserRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /admin/users/{username}"
      Target: !Sub "integrations/${AdminGetUserIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  AllowApiInvokeAdminGetUser:
    Type: AWS::Lambda::Permission
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: !Ref AdminGetUserLambda
      Principal: "apigateway.amazonaws.com"
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/GET/admin/users/*"

  AdminUpdateUserIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AdminUpdateUserLambda.Arn
      PayloadFormatVersion: "2.0"

  AdminUpdateUserRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "PATCH /admin/users/{username}"
      Target: !Sub "integrations/${AdminUpdateUserIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  AllowApiInvokeAdminUpdateUser:
    Type: AWS::Lambda::Permission
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: !Ref AdminUpdateUserLambda
      Principal: "apigateway.amazonaws.com"
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/PATCH/admin/users/*"

  # -------------------------
  # Custom domain + Route53 record (API)
  # -------------------------
  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !If
        - IsProd
        - !Sub "api.${HostedZoneName}"
        - !Sub "api-dev.${HostedZoneName}"
      DomainNameConfigurations:
        - EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
          CertificateArn: !Ref CertificateArn

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomainName
      Stage: !Ref HttpApiStage

  ApiDomainRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !If
        - IsProd
        - !Sub "api.${HostedZoneName}"
        - !Sub "api-dev.${HostedZoneName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiDomainName.RegionalDomainName
        HostedZoneId: !GetAtt ApiDomainName.RegionalHostedZoneId

Outputs:
  UserPoolId:
    Value: !Ref UserPool

  UserPoolClientId:
    Value: !Ref UserPoolClient

  CognitoHostedUiDomainPrefix:
    Value: !If
      - HasCognitoDomainPrefix
      - !Ref CognitoDomainPrefix
      - !Sub "viktron-${Env}-${AWS::AccountId}"

  CognitoHostedUiDomain:
    Value: !Sub
      - "${Prefix}.auth.${AWS::Region}.amazoncognito.com"
      - Prefix: !If
          - HasCognitoDomainPrefix
          - !Ref CognitoDomainPrefix
          - !Sub "viktron-${Env}-${AWS::AccountId}"

  CognitoHostedUiIssuer:
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  ApiEndpointExecuteApi:
    Value: !GetAtt HttpApi.ApiEndpoint

  ApiCustomDomain:
    Value: !If
      - IsProd
      - !Sub "https://api.${HostedZoneName}"
      - !Sub "https://api-dev.${HostedZoneName}"

  AdminUsersEndpoint:
    Value: !If
      - IsProd
      - !Sub "https://api.${HostedZoneName}/admin/users"
      - !Sub "https://api-dev.${HostedZoneName}/admin/users"

  AdminUserDetailEndpoint:
    Value: !If
      - IsProd
      - !Sub "https://api.${HostedZoneName}/admin/users/{username}"
      - !Sub "https://api-dev.${HostedZoneName}/admin/users/{username}"
